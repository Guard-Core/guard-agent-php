name: Scheduled Lint

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  scheduled-composer-audit-lint:
    name: Weekly composer audit + php -l
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: php -l sweep
        run: for f in $(find src bin -name '*.php'); do php -l "$f" > /dev/null || exit 1; done && echo LINT_OK

      - name: Composer audit
        # This package has zero composer dependencies and `composer audit`
        # exits 1 on an empty package graph, so audit only when the lock
        # actually contains packages (the guard self-heals when the first
        # dependency lands).
        run: |
          if [ "$(composer show --locked 2>/dev/null | wc -l)" -gt 0 ]; then
            composer audit --locked
          else
            echo "Zero composer dependencies; nothing to audit."
          fi
