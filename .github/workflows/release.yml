name: Release Gate

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  test:
    name: Test at tag (php ${{ matrix.php }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: php -l sweep
        run: for f in $(find src bin -name '*.php'); do php -l "$f" > /dev/null || exit 1; done && echo LINT_OK

      - name: test_agent
        env:
          REDIS_HOST: 127.0.0.1
        run: php bin/test_agent.php

  composer-audit:
    name: Composer audit at tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Composer audit
        # This package has zero composer dependencies and `composer audit`
        # exits 1 on an empty package graph, so audit only when the lock
        # actually contains packages (the guard self-heals when the first
        # dependency lands).
        run: |
          if [ "$(composer show --locked 2>/dev/null | wc -l)" -gt 0 ]; then
            composer audit --locked
          else
            echo "Zero composer dependencies; nothing to audit."
          fi
