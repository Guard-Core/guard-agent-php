site_name: guard-agent-php
site_description: PHP telemetry agent reporting to the Guard Core App ingestion API
site_author: Renn F
repo_url: https://github.com/Guard-Core/guard-agent-php
repo_name: Guard-Core/guard-agent-php

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
  features:
    - content.code.copy
    - navigation.sections

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - tables

nav:
  - Home: index.md
  - Usage: usage.md
  - Configuration: configuration.md
